[project]
name = "yanalytics"
version = "0.1.0"
description = "A YunoHost instances analytics server"
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "YunoHost", email = "yunohost@yunohost.org" }
]
urls.Repository = "https://github.com/yunohost/yanalytics"

requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlmodel>=0.0.38",
    "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
    "uvicorn",
    "gunicorn",
    "ruff",
    "mypy",
]

[project.scripts]
yanalytics-client = "yanalytics_client:main.main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

lint.select = ["ALL"]

lint.ignore = [
    "C",        # Code complexity
    "COM812",   # Missing trailing comma
    "D",        # pydocstyle
    "EM",       # Exception message
    "ERA001",   # Found commented-out code
    "EXE001",   # Shebang is present but file is not executable
    "FIX002",   # TODOs
    "PLR2004",  # magic-value-comparison
    "RET504",   # Unnecessary assignment before `return` statement
    "S603",     # `subprocess` call: check for execution of untrusted input
    "TD",       # TODO format
    "TRY003",   # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ty.rules]
all = "error"

[tool.mypy]
strict = true
follow_imports = "normal"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = false
